<app-header></app-header>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Sign Up</h2>
    <form (ngSubmit)="signup()">
      <input [(ngModel)]="identifier" name="identifier" placeholder="Username or Email" required>
      <p class="error" *ngIf="identifierError">{{ identifierError }}</p>

      <input type="password" [(ngModel)]="password" name="password" placeholder="Password" required>
      <p class="error" *ngIf="passwordError">{{ passwordError }}</p>

      <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
      <p class="error" *ngIf="confirmError">{{ confirmError }}</p>

      <button type="submit">Create Account</button>
    </form>
    <span (click)="goToLogin()">Already have an account? Login</span>
  </div>
</div>
