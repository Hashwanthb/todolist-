<header class="app-header">
  <div class="container">
    <h1 class="logo">My Todo App</h1>
    <nav class="nav-links" *ngIf="!isLoggedIn">
      <button class="nav-btn" [class.active]="currentRoute === '/signup'" (click)="goToSignup()">Signup</button>
      <button class="nav-btn" [class.active]="currentRoute === '/login'" (click)="goToLogin()">Login</button>
    </nav>
    <nav class="nav-links" *ngIf="isLoggedIn">
      <span class="welcome">Welcome, {{ currentUser }}</span>
      <button class="nav-btn" [class.active]="currentRoute === '/todo'" (click)="goToTodo()">Add Task</button>
      <button class="nav-btn" [class.active]="currentRoute === '/tasks'" (click)="goToTasks()">My Tasks</button>
      <button class="nav-btn logout" (click)="logout()">Logout</button>
    </nav>
  </div>
</header>
